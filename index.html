<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Illegal things</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --card: rgba(15, 23, 42, 0.7);
            --card-border: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --accent: #8b5cf6;
            --accent-2: #22d3ee;
            --shadow: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2), #111827);
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .container {
            width: min(90vw, 760px);
            padding: 3rem 2rem;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 60px var(--shadow);
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before,
        .container::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0.5;
        }

        .container::before {
            width: 220px;
            height: 220px;
            background: rgba(139, 92, 246, 0.35);
            top: -60px;
            left: -40px;
        }

        .container::after {
            width: 180px;
            height: 180px;
            background: rgba(34, 211, 238, 0.35);
            right: -30px;
            bottom: -40px;
        }

        h2, h3 {
            position: relative;
            z-index: 1;
            margin: 0;
        }

        h2 {
            font-size: clamp(2.2rem, 5vw, 4rem);
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #f8fafc, #a78bfa, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        h3 {
            font-size: clamp(1.05rem, 2vw, 1.5rem);
            color: var(--muted);
            line-height: 1.6;
            max-width: 620px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hello world!!</h2>
        <h3>This site is a gift for all the curious kids out there.</h3>
    </div>

    <p></p>
</body>
</html>
